name: Update visual baselines

# Regenerates the Playwright screenshot baselines on the same runner image the
# e2e job uses, so font rendering matches CI. Manual only; commits the updated
# PNGs back to the selected branch.
on:
  workflow_dispatch:
  # workflow_dispatch only works once this file is on the default branch, so a
  # push that adds e2e/.update-baselines also triggers it (the marker is removed
  # in the bot commit).
  push:
    paths:
      - e2e/.update-baselines

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e:update-visual
        env:
          CI: true
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch e2e/.update-baselines
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update visual baselines from CI runner"
            git push
          fi
