# Deploys the built PWA (dist/) to GitHub Pages.
# Manual only: it never runs on push or pull request. Start it from the Actions tab ("Deploy to GitHub Pages" → Run workflow).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Vite's base is './' and routing uses HashRouter, so the app works under https://<owner>.github.io/<repo>/ without changes.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Pages serves files starting with "_" only when Jekyll is off.
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
