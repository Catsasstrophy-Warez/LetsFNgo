name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # This app targets RealityKit/Metal/SwiftData, all iOS-only frameworks —
    # it can't be built as a plain SwiftPM package for the macOS host, so CI
    # goes through the same XcodeGen + xcodebuild path a contributor would
    # use locally, against an iOS Simulator destination. Runs on whatever
    # Xcode version the runner image ships as its default (kept current by
    # GitHub); no version pin here, since this project only needs a recent
    # Swift 6 toolchain, not a specific point release.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          # Hardcoding a device name (e.g. "iPhone 16") is brittle — the
          # exact simulator lineup pre-installed on a given runner image
          # varies by image release and isn't guaranteed to include any
          # specific model. Ask simctl what's actually there instead, and
          # pick the newest iOS runtime's first available iPhone.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
import json, sys
data = json.load(sys.stdin)["devices"]
ios_runtimes = sorted([k for k in data if "iOS" in k], reverse=True)
for runtime in ios_runtimes:
    for device in data[runtime]:
        if "iPhone" in device["name"]:
            print(device["udid"])
            sys.exit(0)
sys.exit(1)
')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" || true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project DayTradeScanner.xcodeproj \
            -scheme DayTradeScanner \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DayTradeScanner.xcodeproj \
            -scheme DayTradeScanner \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
