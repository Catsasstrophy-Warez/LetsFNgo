name: Native builds (unsigned)

# Manual only. Builds an UNSIGNED Android debug APK from the PWA via Capacitor and uploads it as a workflow artifact,
# and validates that the iOS project syncs on macOS. Nothing is signed or published: a store release needs the
# owner's own signing keys and developer accounts (see README → "Native apps").
# The generated android/ and ios/ projects are not committed, so each job creates them fresh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Capacitor 7's Android project needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the retired 'tools' package, which current sdkmanager rejects.
          packages: platform-tools
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gt500-companion-debug-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: gt500-companion-android-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS sync check (no signing)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # ios/ is not committed, so it is generated first; the check is that `cap sync ios` succeeds.
      - run: npx cap add ios
      - run: npx cap sync ios
