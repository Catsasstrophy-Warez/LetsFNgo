name: iPhone build

# Builds Nexus for a real iPhone (iOS 27, arm64). Run it from the Actions tab
# (once this file is on the default branch), push a tag named iphone-*, or
# push a commit whose message contains [iphone].
#
# With the App Store Connect secrets below, it signs the app and uploads it
# to TestFlight; install it on the phone from the TestFlight app. Without
# them, it builds an unsigned .ipa (an artifact of the run) for a sideloading
# tool to sign with your Apple ID. docs/DEVICE.md has the details.
#
# Secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        10-character team ID (developer.apple.com → Membership)
#   ASC_KEY_ID           App Store Connect API key ID (Users and Access → Integrations)
#   ASC_ISSUER_ID        the issuer ID shown above the keys
#   ASC_KEY_P8           the contents of the downloaded AuthKey_<id>.p8
#   BUNDLE_ID_PREFIX     optional; replaces com.catsasstrophy.nexus if that id isn't yours

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["iphone-*"]

concurrency:
  group: iphone-build
  cancel-in-progress: false

jobs:
  iphone:
    name: iPhone (iOS 27)
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[iphone]')
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID_PREFIX: ${{ secrets.BUNDLE_ID_PREFIX }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing mode
        id: mode
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing for TestFlight with team $APPLE_TEAM_ID."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect secrets aren't set, so this builds an unsigned .ipa for sideloading. See docs/DEVICE.md."
          fi
      - name: Generate Xcode project
        run: |
          if [ -n "$BUNDLE_ID_PREFIX" ]; then
            sed -i '' "s/com\.catsasstrophy\.nexus/$BUNDLE_ID_PREFIX/g" project.yml
          fi
          brew install xcodegen
          xcodegen generate
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Archive and upload to TestFlight
        if: steps.mode.outputs.signed == 'true'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project Nexus.xcodeproj -scheme NexusApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nexus.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" -quiet
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Nexus.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "::notice::Build $BUILD_NUMBER was uploaded. It shows in TestFlight once App Store Connect finishes processing it (usually 5–15 minutes)."

      - name: Archive unsigned .ipa
        if: steps.mode.outputs.signed != 'true'
        run: |
          xcodebuild archive -project Nexus.xcodeproj -scheme NexusApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nexus.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -quiet
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Nexus.xcarchive/Products/Applications/Nexus.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Nexus-unsigned.ipa" Payload)
          ls -lh Nexus-unsigned.ipa
      - name: Upload unsigned .ipa
        if: steps.mode.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-unsigned-ipa
          path: Nexus-unsigned.ipa
          retention-days: 14
